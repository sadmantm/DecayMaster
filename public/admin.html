    const sug = traduzir ? sugestaoTraducao(p) : null;
    const idInicial = sug ? sug.id : p.popupId || "";
    const langsIniciais = sug ? sug.langs : p.languages || [];
    let imageUrl = p.imageUrl || "", imageHash = traduzir ? "" : p.imageHash || "";

    const box = modal(`<h2>${traduzir ? `Traduzir "${esc(p.titulo || p.popupId)}"` : novo ? "Novo pop-up" : esc(p.titulo || p.popupId)}</h2>
      ${traduzir ? `<div class="warnbox" style="margin-bottom:12px">Cópia de <b>${esc(p.popupId)}</b>. Troque a arte e o texto do botão para o idioma marcado abaixo.</div>` : ""}
      <div class="grid g2">
        <div class="f"><label>popupId</label><input type="text" id="ppId" value="${esc(idInicial)}" ${novo ? "" : "readonly"} placeholder="skins-outubro-pt">
          <span class="sub">Identidade fixa. Trocar o id faz o jogador ver o pop-up de novo.</span></div>
        <div class="f"><label>Título (só para o painel)</label><input type="text" id="ppTitulo" value="${esc(p.titulo || "")}"></div>
      </div>
      <div class="f" style="margin-top:10px"><label>Imagem</label>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="ppUrl" value="${esc(imageUrl)}" placeholder="https://… ou envie um arquivo">
          <input type="file" id="ppFile" accept="image/png,image/jpeg,image/webp" style="display:none">
          <button class="btn sm" id="ppPick">Enviar arquivo</button></div>
        <span class="sub" id="ppHash">${imageHash ? `hash atual: ${esc(imageHash)}` : "PNG, JPG ou WebP, até 8 MB."}</span></div>
      <img id="ppPrev" src="${esc(imageUrl)}" style="max-height:140px;margin-top:10px;border-radius:6px;${imageUrl ? "" : "display:none"}">
      <div class="grid g2" style="margin-top:10px">
        <div class="f"><label>Link do botão (vazio = sem botão)</label><input type="text" id="ppLink" value="${esc(p.linkUrl || "")}" placeholder="https://discord.gg/…"></div>
        <div class="f"><label>Texto do botão</label><input type="text" id="ppBtn" value="${esc(p.buttonText || "")}" placeholder="Ver skins"></div>
        <div class="f"><label>Frequência</label><select id="ppFreq">${POPUP_FREQ.map(([k, l]) => `<option value="${k}" ${k === (p.frequency || "always") ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="f"><label>Ordem</label><input type="number" id="ppOrder" value="${p.order ?? ""}" placeholder="último"></div>
        <div class="f"><label>Começa em (opcional)</label><input type="datetime-local" id="ppStart" value="${dtLocal(p.startAt)}"></div>
        <div class="f"><label>Termina em (opcional)</label><input type="datetime-local" id="ppEnd" value="${dtLocal(p.endAt)}"></div>

        <div class="f" style="margin-top:10px"><label>Idiomas (nenhum marcado = todos)</label>
        <div class="row">${POPUP_LANGS.map(([k, l]) => `<label class="check"><input type="checkbox" data-lang="${k}" ${langsIniciais.includes(k) ? "checked" : ""}> ${l}</label>`).join("")}</div>
        <span class="sub">Para traduzir, crie uma versão por idioma terminando em -pt, -en ou -es (ex.: skins-outubro-pt). Use o botão "Traduzir" na lista.</span></div>
      <div class="f" style="margin-top:10px"><label>Builds do cliente (uma por linha, vazio = todas)</label>
        <textarea id="ppBuilds" class="code" style="min-height:60px">${esc((p.builds || []).join("\n"))}</textarea></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="ppOn" ${p.enabled !== false ? "checked" : ""}> No ar</label>
      <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn p" id="ppGo">Salvar</button></div>`, { wide: true });

    $("[data-x]", box).onclick = closeModal;
    $("#ppPick", box).onclick = () => {
      const id = $("#ppId", box).value.trim();
      if (!id) return toast("Preencha o popupId antes de enviar a arte.", "warn");
      $("#ppFile", box).click();
    };
    $("#ppFile", box).onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const r = await uploadImagemPopup($("#ppId", box).value.trim(), file);
        imageUrl = r.imageUrl; imageHash = r.imageHash;
        $("#ppUrl", box).value = imageUrl;
        $("#ppHash", box).textContent = `enviada: ${Math.round(r.bytes / 1024)} KB · hash ${r.imageHash}`;
        const prev = $("#ppPrev", box); prev.src = imageUrl; prev.style.display = "";
        toast("Imagem enviada.");
      } catch (err) { toast(err.message, "err"); }
    };
    $("#ppUrl", box).onchange = () => {
      imageUrl = $("#ppUrl", box).value.trim(); imageHash = "";
      const prev = $("#ppPrev", box); prev.src = imageUrl; prev.style.display = imageUrl ? "" : "none";
    };
    $("#ppGo", box).onclick = async () => {
      const body = {
        popupId: $("#ppId", box).value.trim(),
        titulo: $("#ppTitulo", box).value.trim(),
        imageUrl: $("#ppUrl", box).value.trim(),
        imageHash: imageHash || undefined,
        linkUrl: $("#ppLink", box).value.trim(),
        buttonText: $("#ppBtn", box).value.trim(),
        frequency: $("#ppFreq", box).value,
        order: $("#ppOrder", box).value === "" ? undefined : +$("#ppOrder", box).value,
        startAt: dtEpoch($("#ppStart", box).value),
        endAt: dtEpoch($("#ppEnd", box).value),
        platforms: $$("[data-plat]", box).filter((c) => c.checked).map((c) => c.dataset.plat),
        languages: $$("[data-lang]", box).filter((c) => c.checked).map((c) => c.dataset.lang),
        builds: $("#ppBuilds", box).value.split("\n").map((s) => s.trim()).filter(Boolean),
        enabled: $("#ppOn", box).checked,
      };
      const base = baseDoPopup(body.popupId);
      const irmaos = lista.filter((x) => x.popupId !== body.popupId && baseDoPopup(x.popupId) === base && x.enabled !== false);
      if (body.enabled && irmaos.length) {
        if (!body.languages.length)
          return toast(`Já existem versões de "${base}" (${irmaos.map((x) => x.popupId).join(", ")}). Marque o idioma desta.`, "warn", 6000);
        const choque = irmaos.find((x) => !x.languages?.length || x.languages.some((l) => body.languages.includes(l)));
        if (choque)
          return toast(`${choque.popupId} já cobre ${choque.languages?.length ? choque.languages.join(", ").toUpperCase() : "todos os idiomas"}. O jogador veria os dois.`, "warn", 6000);
      }
      await api("/popups", { method: "POST", body });
      closeModal(); toast("Pop-up salvo. Vale no próximo boot do jogador."); load();
    };
  };

  const mover = async (id, delta) => {
    const ids = lista.map((p) => p.popupId);
    const i = ids.indexOf(id), j = i + delta;
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    await api("/popups/reorder", { method: "POST", body: { ids } });
    load();
  };

  setMain(`<div class="top"><div><h1>Pop-ups</h1><p id="ppInfo"></p></div>
      <div class="row"><button class="btn" data-act="reload">Atualizar</button><button class="btn p" data-act="new">Novo pop-up</button></div></div>
      <p class="hint" style="margin:0 0 12px">Os pop-ups aparecem em ordem quando o jogador abre o menu principal. A arte fica salva no aparelho: trocar a imagem aqui (ou usar "Forçar download") faz o cliente baixar a nova e apagar a antiga sozinho. Cada jogador só recebe os pop-ups do idioma configurado no jogo (ou os marcados como "todos").</p>
    <div id="pplist"></div>`);

  ACTIONS.reload = load;
  ACTIONS.new = () => form();
  ACTIONS.edit = (d) => form(lista.find((p) => p.popupId === d.id));
  ACTIONS.up = (d) => mover(d.id, -1);
  ACTIONS.down = (d) => mover(d.id, 1);
  ACTIONS.touch = async (d) => { await api(`/popups/${encodeURIComponent(d.id)}/touch`, { method: "POST", body: {} }); toast("Todos os jogadores vão rebaixar essa arte."); load(); };
  ACTIONS.rm = async (d) => {
    if (await confirmar("Excluir pop-up", `Remove <b>${esc(d.id)}</b> da rotação. A arte sai do disco dos jogadores no próximo boot.`, { danger: true, okLabel: "Excluir" })) {
      await api(`/popups/${encodeURIComponent(d.id)}`, { method: "DELETE" }); toast("Excluído."); load();
    }
  };

  ACTIONS.dup = (d) => form(lista.find((p) => p.popupId === d.id), { traduzir: true });
  await load();
};

    <div id="plist"></div>`);
  paint();
  ACTIONS.add = () => { list.push({ packageId: "dc_novo", amountDC: 100, bonusDC: 0, priceCents: 990 }); paint(); };

const getP = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
const setP = (o, p, v) => { const ks = p.split("."); let c = o; for (const k of ks.slice(0, -1)) { if (typeof c[k] !== "object" || c[k] === null) c[k] = {}; c = c[k]; } if (v === undefined) delete c[ks.at(-1)]; else c[ks.at(-1)] = v; };

VIEWS.config = async function (tab = "form") {
  const r = await api("/config");
  const cfg = JSON.parse(JSON.stringify(r.disco || r.memoria));
  const diff = r.disco && JSON.stringify(r.disco) !== JSON.stringify(r.memoria);
  const field = ([path, label, type, hint, restart]) => {
    const v = getP(cfg, path); const id = `cf_${path.replace(/\./g, "_")}`;
    let input;
    if (type === "bool") input = `<label class="check" style="margin-top:6px"><input type="checkbox" id="${id}" data-path="${path}" data-type="bool" ${v ? "checked" : ""}> ${v ? "sim" : "não"}</label>`;
    else if (type === "lines") input = `<textarea id="${id}" data-path="${path}" data-type="lines">${esc((v || []).join("\n"))}</textarea>`;
    else if (type.startsWith("select:")) input = `<select id="${id}" data-path="${path}" data-type="text">${type.slice(7).split(",").map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    else if (type === "secret") input = `<div class="row" style="flex-wrap:nowrap"><input type="password" id="${id}" data-path="${path}" data-type="text" value="${esc(v ?? "")}"><button class="btn sm" data-act="show" data-t="${id}">Ver</button><button class="btn sm" data-act="gen" data-t="${id}">Gerar</button></div>`;
    else input = `<input type="${type === "text" ? "text" : "number"}" ${type === "float" ? 'step="0.01"' : ""} id="${id}" data-path="${path}" data-type="${type}" value="${esc(v ?? "")}">`;
    return `<div class="f"><label>${label}${restart ? ' <span class="tag" style="font-size:11px">reinício</span>' : ""}</label>${input}${hint ? `<span class="sub">${hint}</span>` : ""}</div>`;
  };
  setMain(`<div class="top"><div><h1>Configuração</h1><p>master.config.json. Campos marcados com "reinício" só valem após reiniciar o processo; os demais valem na hora.</p></div>
    <div class="row"><button class="btn p" data-act="save">Salvar configuração</button></div></div>
  ${diff ? `<div class="warnbox" style="margin-bottom:12px">O arquivo em disco difere do que está em memória (o Play Watcher ou outra rota alterou a config em runtime). Este formulário mostra o <b>disco</b>.</div>` : ""}
  <div class="tabs"><button class="${tab === "form" ? "on" : ""}" data-act="tab" data-t="form">Formulário</button><button class="${tab === "json" ? "on" : ""}" data-act="tab" data-t="json">JSON completo</button></div>
  ${tab === "form" ? `<div class="grid g2">${CFG_SCHEMA.map(([g, fs]) => `<div class="panel"><h2>${g}</h2><div class="grid" style="gap:12px">${fs.map(field).join("")}</div></div>`).join("")}</div>`
    : `<div class="panel"><textarea id="cfgJson" class="code" style="min-height:70vh">${esc(JSON.stringify(cfg, null, 2))}</textarea></div>`}`);
  $$("input[data-type=bool]").forEach((c) => c.onchange = () => c.parentElement.lastChild.textContent = c.checked ? " sim" : " não");
  ACTIONS.tab = (d) => VIEWS.config(d.t);
  ACTIONS.show = (d) => { const i = $("#" + d.t); i.type = i.type === "password" ? "text" : "password"; };
  ACTIONS.gen = async (d) => { const x = await api("/config/generate-secret", { method: "POST", body: {} }); $("#" + d.t).value = x.secret; $("#" + d.t).type = "text"; };
  ACTIONS.save = async () => {
    let novo;
    if (tab === "json") { try { novo = JSON.parse($("#cfgJson").value); } catch (e) { return toast(`JSON inválido: ${e.message}`, "err"); } }
    else {
      novo = cfg;
      $$("[data-path]").forEach((el) => {
        const t = el.dataset.type; let v;
        if (t === "bool") v = el.checked; else if (t === "lines") v = el.value.split("\n").map((s) => s.trim()).filter(Boolean);
        else if (t === "int") v = el.value === "" ? undefined : parseInt(el.value, 10); else if (t === "float") v = el.value === "" ? undefined : parseFloat(el.value);
        else v = el.value === "" ? undefined : el.value;
        setP(novo, el.dataset.path, v);
      });
    }
    const chaveMudou = novo.adminKey !== (r.disco || r.memoria).adminKey || (!novo.adminKey && novo.serverKey !== (r.disco || r.memoria).serverKey);
    const x = await api("/config", { method: "PUT", body: { config: novo } });
    if (x.precisaRestart.length) toast(`Salvo. Reinicie o processo para aplicar: ${x.precisaRestart.join(", ")}`, "warn", 8000); else toast("Configuração salva e aplicada.");
    if (chaveMudou) { await sleep(600); doLogout("Chave alterada. Entre com a nova."); } else VIEWS.config(tab);
  };
};

/* ═══════════════════════════════ LOGS ═══════════════════════════════ */
VIEWS.logs = async function () {
  let level = "all", q = "", paused = false, lastSeq = 0;
  const line = (e) => { const d = document.createElement("div"); d.className = e.level; d.innerHTML = `<span class="t">${new Date(e.ts).toLocaleTimeString("pt-BR")}</span> <span class="lv">${e.level.toUpperCase()}</span> ${esc(e.msg)}`; return d; };
  const passes = (e) => (level === "all" || e.level === level) && (!q || e.msg.toLowerCase().includes(q));
  async function load() {
    const r = await api(`/logs?limit=500`); const box = $("#logbox"); box.innerHTML = "";
    r.rows.filter(passes).forEach((e) => box.appendChild(line(e))); lastSeq = r.lastSeq; box.scrollTop = box.scrollHeight;
  }
  setMain(`<div class="top"><div><h1>Logs</h1><p>Últimas linhas do processo, ao vivo. <span id="lstate" class="tag ok">conectado</span></p></div>
    <div class="row"><select id="llev" class="sm"><option value="all">Todos os níveis</option><option value="error">error</option><option value="warn">warn</option><option value="info">info</option><option value="debug">debug</option></select>
      <input type="text" id="lq" class="sm" placeholder="filtrar texto" style="width:220px"><button class="btn" data-act="pause" id="lpause">Pausar</button><button class="btn" data-act="clear">Limpar tela</button></div></div>
    <div id="logbox"></div>`);
  $("#llev").onchange = (e) => { level = e.target.value; load(); };
  $("#lq").oninput = () => { q = $("#lq").value.trim().toLowerCase(); load(); };
  ACTIONS.pause = () => { paused = !paused; $("#lpause").textContent = paused ? "Retomar" : "Pausar"; if (!paused) load(); };
  ACTIONS.clear = () => $("#logbox").innerHTML = "";
  await load();
  S.es = new EventSource(`${S.base}/admin/api/logs/stream?key=${encodeURIComponent(S.key)}`);
  S.es.onmessage = (ev) => { if (paused) return; const e = JSON.parse(ev.data); if (!passes(e)) return; const box = $("#logbox"); if (!box) return; const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40; box.appendChild(line(e)); while (box.children.length > 1500) box.firstChild.remove(); if (atEnd) box.scrollTop = box.scrollHeight; };
  S.es.onerror = () => { const s = $("#lstate"); if (s) { s.className = "tag danger"; s.textContent = "reconectando…"; } };
  S.es.onopen = () => { const s = $("#lstate"); if (s) { s.className = "tag ok"; s.textContent = "conectado"; } };
};

VIEWS.audit = async function () {
  const st = { action: "", target: "", offset: 0, limit: 100 };
  async function load() {
    const r = await api(`/audit?action=${encodeURIComponent(st.action)}&target=${encodeURIComponent(st.target)}&limit=${st.limit}&offset=${st.offset}`);
    $("#alist").innerHTML = table([
      { h: "Quando", f: (a) => fmtDT(a.createdAt) }, { h: "Ação", f: (a) => `<span class="tag violet">${esc(a.action)}</span>` },
      { h: "Alvo", f: (a) => a.target && /^\d{8}$/.test(a.target) ? `<a href="#/players/${a.target}" class="mono">${a.target}</a>` : `<span class="mono">${esc(a.target || "—")}</span>` },
      { h: "Detalhes", f: (a) => `<span class="mono hint" title="${esc(a.details || "")}">${esc((a.details || "").slice(0, 120))}${(a.details || "").length > 120 ? "…" : ""}</span>` }, { h: "IP", f: (a) => `<span class="mono">${esc(a.ip || "")}</span>` },
    ], r.rows, { empty: "Nenhuma ação registrada ainda." }) + pager(r.total, st.limit, st.offset, "page");
    bindActions($("#alist"));
  }
  setMain(`<div class="top"><div><h1>Auditoria</h1><p>Tudo que foi feito por este painel: quem, quando, em quem.</p></div>
    <div class="row"><select id="aact" class="sm"><option value="">Toda ação</option>${["player", "coins", "ban", "server", "order", "skins", "roulette", "packages", "config", "push", "play"].map((a) => `<option>${a}</option>`).join("")}</select><input type="text" id="atgt" class="sm" placeholder="alvo (playerId, orderId…)" style="width:200px"></div></div><div id="alist"></div>`);
  $("#aact").onchange = (e) => { st.action = e.target.value; st.offset = 0; load(); };
  $("#atgt").oninput = () => { st.target = $("#atgt").value.trim(); st.offset = 0; load(); };
  ACTIONS.page = (d) => { st.offset = Number(d.offset); load(); };
  await load();
};
