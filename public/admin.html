<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DECAY — Painel do Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c222b; --surface:#242c37; --surface2:#2c3542; --line:#3a4554; --line2:#4a5667;
  --text:#e7ebf1; --muted:#8e9aac; --dim:#65718a;
  --gold:#e0a83f; --gold2:#f1c667; --ok:#67b784; --danger:#d96b6b; --info:#6fa5de; --violet:#a98fe0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14px;color:var(--muted);font-weight:500}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── shell ── */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50}
#login form{width:360px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px}
#login h1{margin-bottom:4px}#login p{color:var(--muted);margin:0 0 18px}
#app{display:none;grid-template-columns:216px 1fr;grid-template-rows:56px 1fr;height:100vh}
#app.on{display:grid}
.brand{grid-row:1;grid-column:1;display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.brand b{font-size:15px;letter-spacing:.06em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(103,183,132,.2)}
.brand i.off{background:var(--danger);box-shadow:0 0 0 3px rgba(217,107,107,.2)}
nav{grid-row:2;grid-column:1;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav .grp{color:var(--dim);font-size:12px;padding:12px 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--text);font-weight:500}
nav a:hover{background:var(--surface);text-decoration:none}
nav a.on{background:var(--surface2);color:var(--gold2)}
nav a .n{font-size:11.5px;color:var(--muted);background:var(--bg);padding:0 6px;border-radius:9px}
header{grid-row:1;grid-column:2;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line)}
main{grid-row:2;grid-column:2;overflow:auto;padding:22px 26px 60px}
.cmd{position:relative;flex:1;max-width:640px}
.cmd input{width:100%;height:36px;padding:0 12px 0 38px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.cmd input:focus{border-color:var(--gold)}
.cmd svg{position:absolute;left:12px;top:10px;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
.cmd kbd{position:absolute;right:10px;top:9px;font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.cmd .drop{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:20;overflow:hidden;display:none}
.cmd .drop.on{display:block}
.cmd .drop div{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.cmd .drop div:hover,.cmd .drop div.sel{background:var(--surface2)}
.cmd .drop small{color:var(--muted)}
header .me{color:var(--muted);font-size:13px;white-space:nowrap}
header .me b{color:var(--text);font-weight:500}

/* ── layout bits ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top p{color:var(--muted);margin:2px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){#app{grid-template-columns:1fr}nav{display:none}.brand{display:none}header,main{grid-column:1}.g2,.g3,.g4{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel > h2,.panel > .ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{padding:14px 16px}
.stat .v{font-size:26px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.stat .s{color:var(--dim);font-size:12px;margin-top:6px}
.stat.gold .v{color:var(--gold2)}.stat.ok .v{color:var(--ok)}.stat.danger .v{color:var(--danger)}.stat.info .v{color:var(--info)}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.hint{color:var(--muted);font-size:12.5px}
.warnbox{background:rgba(224,168,63,.1);border:1px solid rgba(224,168,63,.35);color:var(--gold2);padding:10px 14px;border-radius:var(--r);font-size:13px}
.dangerbox{background:rgba(217,107,107,.1);border:1px solid rgba(217,107,107,.35);color:#f0a0a0;padding:10px 14px;border-radius:var(--r);font-size:13px}

/* ── tables ── */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{color:var(--muted);font-weight:500;background:var(--surface2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}

/* ── tags ── */
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:rgba(103,183,132,.4)}.tag.danger{color:var(--danger);border-color:rgba(217,107,107,.4)}
.tag.gold{color:var(--gold2);border-color:rgba(224,168,63,.4)}.tag.info{color:var(--info);border-color:rgba(111,165,222,.4)}
.tag.violet{color:var(--violet);border-color:rgba(169,143,224,.4)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)}

/* ── forms ── */
.f{display:flex;flex-direction:column;gap:4px}
.f label{color:var(--muted);font-size:12.5px}
.f .sub{color:var(--dim);font-size:12px}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{resize:vertical;min-height:80px}
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:300px;line-height:1.5}
input.sm,select.sm{padding:5px 8px;width:auto}
.check{display:flex;gap:8px;align-items:center;color:var(--text);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--gold)}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--gold);border-color:var(--gold);color:#1c1a12}.btn.p:hover{background:var(--gold2)}
.btn.d{border-color:rgba(217,107,107,.5);color:var(--danger)}.btn.d:hover{background:rgba(217,107,107,.12)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* ── modal / toast ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40;padding:20px}
#modal.on{display:grid}
#modal .box{background:var(--surface);border:1px solid var(--line2);border-radius:10px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
#modal .box.wide{width:min(860px,100%)}
#modal h2{margin-bottom:14px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--surface2);border:1px solid var(--line2);border-left:3px solid var(--ok);padding:10px 14px;border-radius:var(--r);min-width:260px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--gold)}

/* ── charts ── */
.chart{width:100%;height:170px;display:block}
.chart rect{fill:var(--gold)}.chart rect.b{fill:var(--info)}.chart text{fill:var(--dim);font:10.5px var(--mono)}
.chart line{stroke:var(--line)}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.bars span{height:10px;background:var(--gold);border-radius:3px;min-width:2px}
.bars small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ── relatórios ── */
.section-title{margin:24px 0 10px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.delta{font-size:12px;font-weight:500;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}.delta.flat{color:var(--muted)}
.lchart{width:100%;height:auto;display:block}
.lchart text{fill:var(--dim);font:10.5px var(--mono)}
.lchart line.g{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.spark{width:100%;height:34px;display:block;margin-top:8px}
.verdict{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;align-items:center}
.verdict .big{font-size:28px;font-weight:600;margin:2px 0}
.verdict.up{border-color:rgba(103,183,132,.5)}.verdict.up .big{color:var(--ok)}
.verdict.down{border-color:rgba(217,107,107,.5)}.verdict.down .big{color:var(--danger)}
.verdict.flat .big{color:var(--gold2)}
.sinais{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 22px;font-size:13px}
.sinais div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}
table.coh td.c,table.coh th.c{text-align:center;font-variant-numeric:tabular-nums;padding:6px 8px}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10.5px}
.heat > div{height:18px;border-radius:2px}
.heat .lb{color:var(--dim);font-family:var(--mono);text-align:center;line-height:18px}
@media (max-width:760px){.verdict{grid-template-columns:1fr}}

/* ── logs ── */
#logbox{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);height:calc(100vh - 270px);overflow:auto;padding:8px 12px}
#logbox div{white-space:pre-wrap;word-break:break-word;padding:1px 0;border-bottom:1px solid rgba(255,255,255,.02)}
#logbox .t{color:var(--dim)}#logbox .lv{display:inline-block;width:52px}
#logbox .debug .lv{color:var(--dim)}#logbox .info .lv{color:var(--info)}#logbox .warn .lv{color:var(--gold2)}
#logbox .error{background:rgba(217,107,107,.06)}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>DECAY Master</h1>
    <p>Painel de administração do servidor</p>
    <div class="f"><label>Endereço do master</label><input type="text" id="loginUrl" placeholder="http://localhost:3000"></div>
    <div class="f" style="margin-top:10px"><label>Chave de administrador</label><input type="password" id="loginKey" autofocus placeholder="adminKey do master.config.json"></div>
    <div id="loginErr" class="dangerbox" style="display:none;margin-top:12px"></div>
    <button class="btn p" style="width:100%;justify-content:center;margin-top:16px">Entrar</button>
  </form>
</div>

<div id="app">
  <div class="brand"><i id="hb"></i><b>DECAY</b><span class="hint">master</span></div>
  <nav id="nav"></nav>
  <header>
    <div class="cmd">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="cmd" type="text" placeholder="Buscar jogador por id, nick, e-mail, device ou pedido…" autocomplete="off">
      <kbd>/</kbd>
      <div class="drop" id="cmdDrop"></div>
    </div>
    <div class="me"><b id="srvName">—</b> <span id="srvTime"></span></div>
    <button class="btn ghost sm" id="logout">Sair</button>
  </header>
  <main id="main"></main>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>

<script>
/* ═══════════════════════════════ infra ═══════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => Number(n || 0).toLocaleString("pt-BR");
const fmtTempo = (s) => {
  s = Math.round(s || 0);
  if (s < 60) return `${s}s`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${fmtN(h)}h ${String(m).padStart(2, "0")}min` : `${m}min`;
};
const fmtMin = (v) => (v == null || !isFinite(v) ? "—" : fmtTempo(v * 60));
const fmtHoras = (v) => (v == null || !isFinite(v) ? "—" : `${fmtDec(v, 1)} h`);
const fmtBRL = (c) => "R$ " + (Number(c || 0) / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDT = (s) => s ? new Date(s * 1000).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const fmtD = (s) => s ? new Date(s * 1000).toLocaleDateString("pt-BR") : "—";
const ago = (s) => { if (!s) return "—"; const d = Math.floor(Date.now() / 1000) - s; if (d < 60) return `${d}s`; if (d < 3600) return `${Math.floor(d / 60)}min`; if (d < 86400) return `${Math.floor(d / 3600)}h`; return `${Math.floor(d / 86400)}d`; };
const dur = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}min` : `${m}min`; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const S = {
  base: localStorage.getItem("decay.base") || location.origin,
  key: sessionStorage.getItem("decay.key") || "",
  timers: [], es: null,
};

async function api(path, { method = "GET", body, silent } = {}) {
  const res = await fetch(S.base + "/admin/api" + path, {
    method,
    headers: { "Content-Type": "application/json", "X-Admin-Key": S.key },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch { /* vazio */ }
  if (res.status === 401) { doLogout("Chave recusada pelo servidor."); throw new Error("não autorizado"); }
  if (!res.ok || (json && json.ok === false)) {
    const msg = json?.error || `${res.status} ${res.statusText}`;
    if (!silent) toast(msg, "err");
    throw new Error(msg);
  }
  return json;
}

function toast(msg, kind = "ok", ms = 3800) {
  const el = document.createElement("div");
  el.className = `toast ${kind}`; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function modal(html, { wide } = {}) {
  const box = $("#modalBox"); box.className = "box" + (wide ? " wide" : "");
  box.innerHTML = html; $("#modal").classList.add("on");
  const first = box.querySelector("input,select,textarea,button"); first && first.focus();
  return box;
}
function closeModal() { $("#modal").classList.remove("on"); $("#modalBox").innerHTML = ""; }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function confirmar(titulo, texto, { danger, okLabel = "Confirmar", campo } = {}) {
  return new Promise((resolve) => {
    const box = modal(`<h2>${esc(titulo)}</h2><p style="color:var(--muted);margin:0">${texto}</p>
      ${campo ? `<div class="f" style="margin-top:14px"><label>${esc(campo.label)}</label><input type="text" id="cfField" value="${esc(campo.value || "")}" placeholder="${esc(campo.placeholder || "")}"></div>` : ""}
      <div class="acts"><button class="btn" id="cfNo">Cancelar</button><button class="btn ${danger ? "d" : "p"}" id="cfYes">${esc(okLabel)}</button></div>`);
    $("#cfNo", box).onclick = () => { closeModal(); resolve(null); };
    $("#cfYes", box).onclick = () => { const v = campo ? $("#cfField", box).value : true; closeModal(); resolve(v); };
  });
}

function bindActions(root) {
  $$("[data-act]", root).forEach((el) => {
    el.addEventListener("click", (e) => {
      const fn = ACTIONS[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el.dataset, el); }
    });
  });
}
const ACTIONS = {};
function goto(hash) { location.hash = hash; }

/* ═══════════════════════════════ login ═══════════════════════════════ */
$("#loginUrl").value = S.base;
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  S.base = $("#loginUrl").value.trim().replace(/\/+$/, "") || location.origin;
  S.key = $("#loginKey").value.trim();
  localStorage.setItem("decay.base", S.base);
  try {
    const p = await api("/ping", { silent: true });
    sessionStorage.setItem("decay.key", S.key);
    entrar(p);
  } catch (err) {
    const box = $("#loginErr"); box.style.display = "block";
    box.textContent = /não autorizado/.test(err.message) ? "Chave inválida." : `Não foi possível conectar: ${err.message}`;
  }
});
function doLogout(msg) {
  sessionStorage.removeItem("decay.key"); S.key = "";
  S.timers.forEach(clearInterval); S.timers = []; S.es?.close();
  $("#app").classList.remove("on"); $("#login").style.display = "grid";
  if (msg) { const b = $("#loginErr"); b.style.display = "block"; b.textContent = msg; }
}
$("#logout").onclick = () => doLogout();
function entrar(p) {
  $("#login").style.display = "none"; $("#app").classList.add("on");
  $("#srvName").textContent = p.serverName;
  if (p.usingServerKey) toast("adminKey não definida: o painel está usando a serverKey. Defina uma chave separada em Configuração.", "warn", 9000);
  renderNav(); route();
  const hb = async () => { try { const x = await api("/ping", { silent: true }); $("#hb").className = ""; $("#srvTime").textContent = new Date(x.time * 1000).toLocaleTimeString("pt-BR"); } catch { $("#hb").className = "off"; } };
  hb(); S.timers.push(setInterval(hb, 15000));
}
if (S.key) api("/ping", { silent: true }).then(entrar).catch(() => doLogout());

/* ═══════════════════════════════ nav / router ═══════════════════════════════ */
const NAV = [
["Operação", [["overview", "Visão geral"], ["players", "Jogadores"], ["coins", "Moedas"], ["bans", "Banimentos"], ["servers", "Servidores"], ["push", "Push"]]],
["Loja", [["orders","Pedidos"], ["reports","Relatórios"], ["skins","Skins"], ["roulette","Roleta"],
             ["packages","Pacotes DC"], ["popups","Pop-ups"]]],
["Sistema", [["config", "Configuração"], ["logs", "Logs"], ["audit", "Auditoria"]]],
];
function renderNav() {

/* ═══════════════════════════════ busca global ═══════════════════════════════ */
const cmd = $("#cmd"), drop = $("#cmdDrop");
let cmdT = null, cmdSel = 0, cmdItems = [];
document.addEventListener("keydown", (e) => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); cmd.focus(); } });
cmd.addEventListener("input", () => { clearTimeout(cmdT); cmdT = setTimeout(buscarCmd, 220); });
cmd.addEventListener("blur", () => setTimeout(() => drop.classList.remove("on"), 150));
cmd.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { cmdSel = Math.min(cmdItems.length - 1, cmdSel + 1); paintCmd(); e.preventDefault(); }
  if (e.key === "ArrowUp") { cmdSel = Math.max(0, cmdSel - 1); paintCmd(); e.preventDefault(); }
  if (e.key === "Enter" && cmdItems[cmdSel]) { goto(cmdItems[cmdSel].href); drop.classList.remove("on"); cmd.value = ""; }
});
async function buscarCmd() {
  const q = cmd.value.trim(); cmdItems = []; cmdSel = 0;
  if (q.length < 2) return drop.classList.remove("on");
  if (/^dc_\d+_/.test(q)) cmdItems.push({ href: `#/orders/mp/${q}`, t: `Pedido MP ${q}`, s: "Mercado Pago" });
  try {
    const r = await api(`/players?q=${encodeURIComponent(q)}&limit=8`, { silent: true });
    for (const p of r.rows) cmdItems.push({ href: `#/players/${p.playerId}`, t: `${p.playerName || "(sem nome)"}`, s: `${p.playerId} · ${p.accountType} · lvl ${p.level}${p.banned ? " · BANIDO" : ""}` });
  } catch { /* ignora */ }
  if (!cmdItems.length) cmdItems.push({ href: `#/players/q/${encodeURIComponent(q)}`, t: `Nenhum jogador para "${q}"`, s: "abrir lista" });
  paintCmd(); drop.classList.add("on");
}
function paintCmd() {
  drop.innerHTML = cmdItems.map((i, k) => `<div class="${k === cmdSel ? "sel" : ""}" data-h="${esc(i.href)}"><span>${esc(i.t)}</span><small>${esc(i.s)}</small></div>`).join("");
  $$("div", drop).forEach((d) => d.onmousedown = () => { goto(d.dataset.h); cmd.value = ""; });
}

function stat(l, v, s = "", cls = "") { return `<div class="panel stat ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`; }
function table(cols, rows, { rowAttr, empty = "Nada por aqui." } = {}) {
  if (!rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map((c) => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r) => `<tr ${rowAttr ? rowAttr(r) : ""}>${cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function pager(total, limit, offset, act) {
  const from = total ? offset + 1 : 0, to = Math.min(total, offset + limit);
  return `<div class="pager"><span>${from}–${to} de ${fmtN(total)}</span><span class="row">
    <button class="btn sm" data-act="${act}" data-offset="${Math.max(0, offset - limit)}" ${offset === 0 ? "disabled" : ""}>Anterior</button>
    <button class="btn sm" data-act="${act}" data-offset="${offset + limit}" ${to >= total ? "disabled" : ""}>Próxima</button></span></div>`;
}
function playerLink(id, name) { return `<a href="#/players/${id}">${esc(name || "(sem nome)")}</a> <span class="hint mono">${id}</span>`; }
function statusTag(s) {
  const m = { approved: "ok", credited: "ok", purchased: "ok", pending: "gold", review: "danger", rejected: "danger", cancelled: "", canceled: "", voided: "danger", expired: "", failed: "danger", refunded: "danger", Online: "ok", Cheio: "gold", Offline: "danger", "Manutenção": "info" };
  return `<span class="tag ${m[s] ?? ""}">${esc(s)}</span>`;
}
function barChart(series, { labelKey = "dia", valKey = "n", series2 } = {}) {
  if (!series.length) return `<div class="empty">Sem dados no período.</div>`;
  const W = 640, H = 170, pad = 28, bw = (W - pad) / series.length;
  const max = Math.max(1, ...series.map((d) => d[valKey]), ...(series2 || []).map((d) => d[valKey]));
  const idx2 = new Map((series2 || []).map((d) => [d[labelKey], d[valKey]]));
  const step = Math.max(1, Math.floor(series.length / 8));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${H - 20}" x2="${W}" y2="${H - 20}"/>
    <text x="0" y="12">${fmtN(max)}</text><text x="0" y="${H - 22}">0</text>
    ${series.map((d, i) => {
      const v = d[valKey], h = (v / max) * (H - 36), x = pad + i * bw;
      const v2 = idx2.get(d[labelKey]), h2 = v2 ? (v2 / max) * (H - 36) : 0;
      return `<rect x="${x + 1}" y="${H - 20 - h}" width="${Math.max(1, bw / (series2 ? 2 : 1) - 2)}" height="${h}"><title>${esc(d[labelKey])}: ${fmtN(v)}</title></rect>
        ${series2 ? `<rect class="b" x="${x + bw / 2}" y="${H - 20 - h2}" width="${Math.max(1, bw / 2 - 2)}" height="${h2}"><title>${esc(d[labelKey])}: ${fmtN(v2 || 0)}</title></rect>` : ""}
        ${i % step === 0 ? `<text x="${x}" y="${H - 6}">${esc(String(d[labelKey]).slice(5))}</text>` : ""}`;
    }).join("")}</svg>`;
}
function hbars(rows, lk, vk, fmt = fmtN) {
  if (!rows.length) return `<div class="empty">Sem dados.</div>`;
  const max = Math.max(1, ...rows.map((r) => r[vk]));
  return `<div class="bars">${rows.map((r) => `<div><span class="hint" style="background:none;height:auto;color:var(--text)">${esc(r[lk] ?? "?")}</span><span style="width:${(r[vk] / max) * 100}%"></span><small>${fmt(r[vk])}</small></div>`).join("")}</div>`;
}

  async function load() {
    const r = await api(`/players?q=${encodeURIComponent(st.q)}&type=${st.type}&sort=${st.sort}&dir=${st.dir}&limit=${st.limit}&offset=${st.offset}`);
    $("#plist").innerHTML = table([

  $("#ptype").onchange = (e) => { st.type = e.target.value; st.offset = 0; load(); };
  $("#psort").onchange = (e) => { st.sort = e.target.value; st.dir = e.target.value === "playerName" ? "asc" : "desc"; st.offset = 0; load(); };

      { h: "Pedido", f: (o) => `<a href="#/orders/mp/${o.orderId}" class="mono">${o.orderId}</a>` }, { h: "Pacote", f: (o) => `${esc(o.packageId)} <span class="hint">${o.amountDC + o.bonusDC} DC</span>` },

      { h: "Criado", f: (o) => fmtDT(o.createdAt) }, { h: "Creditado", f: (o) => fmtDT(o.creditedAt) }], d.ordersMp, { empty: "Nenhum pedido MP." })}
    <h2 style="margin:18px 0 12px">Google Play</h2>${table([

      { h: "DC", f: (o) => fmtN(o.totalDC), num: true }, { h: "Status", f: (o) => statusTag(o.status) }, { h: "Ack", f: (o) => o.acknowledged ? "sim" : '<span class="tag gold">não</span>' },

  if (tab === "ledger") body = `<div class="panel"><h2>Ledger de moedas</h2>${table([
      { h: "Quando", f: (l) => fmtDT(l.createdAt) }, { h: "Δ", f: (l) => `<b style="color:${l.delta >= 0 ? "var(--ok)" : "var(--danger)"}">${l.delta > 0 ? "+" : ""}${fmtN(l.delta)} ${l.currency || "DC"}</b>`, num: true },
      { h: "Saldo após", f: (l) => fmtN(l.balance), num: true }, { h: "Origem", f: (l) => `<span class="tag">${esc(l.source)}</span>` }, { h: "Ref / motivo", f: (l) => `<span class="mono">${esc(l.refId || "—")}</span>` }], d.ledger, { empty: "Sem movimentações." })}</div>`;
  if (tab === "devices") body = `<div class="panel"><h2>Dispositivos vistos</h2><p class="hint" style="margin:0 0 12px">Ao banir, todos estes device/hardware IDs e IPs entram na lista de bloqueio.</p>${table([
      { h: "Plataforma", f: (f) => `${esc(f.platform || "?")} <span class="hint">${esc(f.model || "")}</span>` }, { h: "deviceId", f: (f) => `<span class="mono">${esc(f.deviceId || "—")}</span>` },
      { h: "hardwareId", f: (f) => `<span class="mono">${esc(f.hardwareId || "—")}</span>` }, { h: "Último IP", f: (f) => `<span class="mono">${esc(f.ip || "—")}</span>` },
      { h: "Vezes", f: (f) => f.seenCount, num: true }, { h: "Primeiro", f: (f) => fmtDT(f.firstSeen) }, { h: "Último", f: (f) => fmtDT(f.lastSeen) }], d.fingerprints, { empty: "Nenhum fingerprint registrado (o jogador nunca logou por esta versão do cliente)." })}</div>`;

  <div class="tabs">${TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}</div>${body}`);

  const reload = (t = tab) => { history.replaceState(null, "", `#/players/${id}/${t}`); return playerDetail(id, t); };
  function renderTempoJogador(pt) {
  if (!pt || !pt.totalSeconds) return `<div class="empty">Este jogador ainda não tem tempo de partida registrado.</div>`;
  const media = pt.sessions ? pt.totalSeconds / pt.sessions : null;

    ${stat("Tempo total jogado", fmtTempo(pt.totalSeconds), `${fmtN(pt.sessions)} sessões · ${fmtN(pt.diasJogadosTotal)} dia(s) com partida`, "gold")}
    ${stat("Últimos 30 dias", fmtTempo(seg30), `jogou em ${pt.diasJogados30} de 30 dias`, "info")}
    ${stat("Duração média da sessão", media ? fmtTempo(media) : "—", `${pt.servers.length} servidor(es) diferentes`)}
    ${stat("Última partida", pt.lastPlayedAt ? `${ago(pt.lastPlayedAt)} atrás` : "—", `primeira em ${fmtD(pt.firstPlayedAt)}`, "ok")}
  </div>
  <div class="panel" style="margin-top:14px"><h2 style="margin-bottom:10px">Minutos jogados por dia (30 dias)</h2>
    ${lineChart(pt.tempoDiario.map((x) => x.day), [{ name: "Minutos", values: pt.tempoDiario.map((x) => Math.round(x.seg / 60)), color: "var(--gold)", w: 2.5 }], { fmt: (v) => `${fmtN(Math.round(v))}min` })}</div>
  <div class="panel" style="margin-top:14px"><h2 style="margin-bottom:10px">Por servidor</h2>

      { h: "Primeira", f: (s) => fmtDT(s.firstPlayedAt) },
      { h: "Última", f: (s) => `${ago(s.lastPlayedAt)} atrás` },
    ], pt.servers)}</div>`;
}
  ACTIONS.tab = (d) => reload(d.tab);
  ACTIONS.revoke = async () => { if (await confirmar("Encerrar sessões", "O jogador precisará fazer login de novo em todos os aparelhos.")) { const r = await api(`/players/${id}/sessions/revoke`, { method: "POST", body: {} }); toast(`${r.removidas} sessão(ões) encerrada(s).`); reload(); } };
  ACTIONS.ban = async () => { const m = await confirmar("Banir jogador", `Bloqueia a conta e todos os ${d.fingerprints.length} dispositivo(s)/IP(s) conhecidos.`, { danger: true, okLabel: "Banir", campo: { label: "Motivo", placeholder: "ex.: cheat, chargeback" } }); if (m !== null) { await api("/bans", { method: "POST", body: { playerId: id, reason: m } }); toast("Jogador banido."); reload(); } };
  ACTIONS.unban = async () => { await api(`/bans/${id}`, { method: "DELETE" }); toast("Banimento removido."); reload(); };
  ACTIONS.delete = async () => { const v = await confirmar("Excluir conta", `Digite <b>${a.playerId}</b> para confirmar. Esta ação não pode ser desfeita.`, { danger: true, okLabel: "Excluir", campo: { label: "playerId" } }); if (v === String(a.playerId)) { await api(`/players/${id}`, { method: "DELETE" }); toast("Conta excluída."); goto("#/players"); } else if (v !== null) toast("playerId não confere.", "warn"); };
  ACTIONS.adjust = async () => { const delta = +$("#ajDelta").value; if (!delta) return toast("Informe a quantidade.", "warn"); const r = await api("/coins/adjust", { method: "POST", body: { playerId: id, currency: $("#ajCur").value, delta, reason: $("#ajReason").value, allowNegative: $("#ajNeg").checked } }); toast(`Saldo ${r.currency}: ${fmtN(r.balance)}`); reload(); };
  ACTIONS.transfer = async () => { const r = await api("/coins/transfer", { method: "POST", body: { fromPlayerId: id, toPlayerId: +$("#trTo").value, currency: $("#trCur").value, amount: +$("#trAmt").value, reason: $("#trReason").value } }); toast(`Transferido. Saldo agora ${fmtN(r.balances.from)}.`); reload(); };
  ACTIONS.grant = async () => { const skinId = +$("#gSkin").value; if (!skinId) return; const r = await api(`/players/${id}/skins`, { method: "POST", body: { skinId } }); toast(r.jaPossuia ? "Já possuía." : "Skin concedida."); reload(); };
  ACTIONS.rmskin = async (dd) => { await api(`/players/${id}/skins/${dd.skin}`, { method: "DELETE" }); toast("Skin removida."); reload(); };
  ACTIONS.revokeplay = async (dd) => { if (await confirmar("Estornar compra Play", "Debita o DC creditado (sem deixar saldo negativo) e marca a compra como anulada.", { danger: true, okLabel: "Estornar" })) { await api(`/orders/play/${encodeURIComponent(dd.token)}/revoke`, { method: "POST", body: {} }); toast("Compra estornada."); reload(); } };
  ACTIONS.edit = () => {
    const box = modal(`<h2>Editar conta ${a.playerId}</h2><div class="grid g2">
      <div class="f"><label>Nick</label><input type="text" id="eName" value="${esc(a.playerName || "")}"></div>
      ${a.accountType === "email" ? `<div class="f"><label>E-mail</label><input type="email" id="eEmail" value="${esc(a.email || "")}"></div><div class="f"><label>Nova senha (deixe vazio para manter)</label><input type="text" id="ePass"></div>` : "<div></div>"}
      <div class="f"><label>Nível</label><input type="number" id="eLevel" value="${a.level}" min="1"></div><div class="f"><label>XP</label><input type="number" id="eXp" value="${a.xp}" min="0"></div>
      <div class="f"><label>Kills</label><input type="number" id="eK" value="${a.kills}" min="0"></div><div class="f"><label>Deaths</label><input type="number" id="eD" value="${a.deaths}" min="0"></div><div class="f"><label>Headshots</label><input type="number" id="eH" value="${a.headshots}" min="0"></div></div>
      <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn p" id="eGo">Salvar alterações</button></div>`);
    $("[data-x]", box).onclick = closeModal;
    $("#eGo", box).onclick = async () => {
      const body = { playerName: $("#eName", box).value.trim(), level: +$("#eLevel", box).value, xp: +$("#eXp", box).value, kills: +$("#eK", box).value, deaths: +$("#eD", box).value, headshots: +$("#eH", box).value };
      if ($("#eEmail", box)) body.email = $("#eEmail", box).value.trim();
      if ($("#ePass", box)?.value) body.password = $("#ePass", box).value;
      await api(`/players/${id}`, { method: "PATCH", body }); closeModal(); toast("Alterações salvas."); reload();
    };
  };
  ACTIONS.rlsave = async (dd) => {
    const body = {};
    $$("[data-rl]").filter((el) => el.dataset.rl === dd.rid).forEach((el) => { body[el.dataset.k] = parseInt(el.value, 10) || 0; });
    await api(`/players/${id}/roulette/${encodeURIComponent(dd.rid)}`, { method: "PATCH", body });
    toast("Progresso da roleta salvo."); reload();
  };
  ACTIONS.rlreset = async (dd) => {
    if (!(await confirmar("Zerar progresso", `Zera giros grátis, progresso e contador de pity de <b>${esc(dd.rid)}</b>. O histórico de giros fica.`, { danger: true, okLabel: "Zerar" }))) return;
    await api(`/players/${id}/roulette/${encodeURIComponent(dd.rid)}`, { method: "DELETE" });
    toast("Progresso zerado."); reload();
  };
  ACTIONS.rlgrant = async () => {
    const rid = $("#rlRid").value.trim();
    const n = parseInt($("#rlQtd").value, 10);
    if (!rid || !(n > 0)) return toast("Informe a roleta e a quantidade.", "warn");
    await api(`/players/${id}/roulette/${encodeURIComponent(rid)}`, { method: "PATCH", body: { addFreeSpins: n } });
    toast(`${n} giro(s) grátis concedido(s).`); reload();
  };
}

    $("#ledger").innerHTML = table([
      { h: "Quando", f: (l) => fmtDT(l.createdAt) }, { h: "Jogador", f: (l) => playerLink(l.playerId, l.playerName) },
      { h: "Δ", f: (l) => `<b style="color:${l.delta >= 0 ? "var(--ok)" : "var(--danger)"}">${l.delta > 0 ? "+" : ""}${fmtN(l.delta)} ${l.currency || "DC"}</b>`, num: true },
      { h: "Saldo após", f: (l) => fmtN(l.balance), num: true }, { h: "Origem", f: (l) => `<span class="tag">${esc(l.source)}</span>` }, { h: "Ref / motivo", f: (l) => `<span class="mono">${esc(l.refId || "—")}</span>` },

      <div class="f" style="margin-top:10px"><label>Motivo</label><input type="text" id="aReason"></div>
      <div class="row" style="margin-top:12px"><label class="check"><input type="checkbox" id="aNeg"> Permitir negativo</label><button class="btn p" data-act="adjust" style="margin-left:auto">Aplicar</button></div></div>
    <div class="panel"><h2>Transferir entre contas</h2><div class="grid g3">
      <div class="f"><label>De (playerId)</label><input type="text" id="tFrom"></div><div class="f"><label>Para (playerId)</label><input type="text" id="tTo"></div><div class="f"><label>Moeda</label><select id="tCur"><option>DC</option><option>DS</option></select></div></div>
      <div class="grid g2" style="margin-top:10px"><div class="f"><label>Quantidade</label><input type="number" id="tAmt" min="1"></div><div class="f"><label>Motivo</label><input type="text" id="tReason"></div></div>
      <div class="row" style="margin-top:12px"><button class="btn p" data-act="transfer" style="margin-left:auto">Transferir</button></div></div></div>
  <div class="panel"><div class="ph"><h2>Ledger</h2><div class="row">
    <input type="text" id="lId" class="sm" placeholder="playerId" style="width:120px"><select id="lSrc" class="sm"><option value="">Toda origem</option><option>mercadopago</option><option>googleplay</option><option>googleplay_refund</option><option>admin</option></select>
    <select id="lCur" class="sm"><option value="">DC e DS</option><option>DC</option><option>DS</option></select></div></div><div id="ledger"></div></div>`);
  $("#lId").oninput = () => { st.playerId = $("#lId").value.trim(); st.offset = 0; load(); };
  $("#lSrc").onchange = (e) => { st.source = e.target.value; st.offset = 0; load(); };
  $("#lCur").onchange = (e) => { st.currency = e.target.value; st.offset = 0; load(); };

  await load();
};

/* ═══════════════════════════════ BANIMENTOS ═══════════════════════════════ */
VIEWS.bans = async function () {
  let all = false;
  async function load() {
    const [r, s] = await Promise.all([api(`/bans?all=${all ? 1 : 0}`), api("/bans/settings")]);
    $("#banIp").checked = s.banByIp;
    $("#blist").innerHTML = table([
      { h: "Status", f: (b) => `<span class="tag ${b.active ? "danger" : ""}">${b.active ? "ativo" : "removido"}</span>` },
      { h: "Jogador", f: (b) => playerLink(b.playerId, b.playerName) }, { h: "Motivo", f: (b) => esc(b.reason) }, { h: "Por", f: (b) => esc(b.admin) },
      { h: "Devices", f: (b) => b.deviceIds.length, num: true }, { h: "Hardware", f: (b) => b.hardwareIds.length, num: true }, { h: "IPs", f: (b) => b.ips.length, num: true },
      { h: "Quando", f: (b) => fmtDT(b.createdAt) },
      { h: "", f: (b) => `<button class="btn sm" data-act="edit" data-ban="${esc(b.banId)}">Detalhes</button> ${b.active ? `<button class="btn sm" data-act="unban" data-id="${b.playerId}">Desbanir</button>` : ""}` },
    ], r.bans, { empty: "Nenhum banimento." });
    bindActions($("#blist"));
    S._bans = r.bans;
  }
  setMain(`<div class="top"><div><h1>Banimentos</h1><p>Um ban bloqueia login por conta, deviceId, hardwareId e (opcionalmente) IP.</p></div>
    <div class="row"><label class="check"><input type="checkbox" id="banIp"> Bloquear também por IP</label><label class="check"><input type="checkbox" id="banAll"> Mostrar removidos</label><button class="btn d" data-act="new">Banir por playerId</button></div></div>
    <div class="warnbox" style="margin-bottom:12px">Ban por IP pega jogadores atrás do mesmo NAT (escola, faculdade, casa). Se um inocente reclamar, abra o ban em "Detalhes" e remova o IP da lista.</div>
    <div id="blist"></div>`);
  $("#banAll").onchange = (e) => { all = e.target.checked; load(); };
  $("#banIp").onchange = async (e) => { await api("/bans/settings", { method: "PUT", body: { banByIp: e.target.checked } }); toast(e.target.checked ? "Ban por IP ativado." : "Ban por IP desativado (até reiniciar)."); };
  ACTIONS.new = async () => { const v = await confirmar("Banir jogador", "Informe o playerId. O motivo pode ser adicionado nos detalhes.", { danger: true, okLabel: "Banir", campo: { label: "playerId" } }); if (v) { await api("/bans", { method: "POST", body: { playerId: +v, reason: "Banido pelo painel" } }); toast("Banido."); load(); } };
  ACTIONS.unban = async (d) => { await api(`/bans/${d.id}`, { method: "DELETE" }); toast("Banimento removido."); load(); };
  ACTIONS.edit = (d) => {
    const b = S._bans.find((x) => x.banId === d.ban);
    const box = modal(`<h2>Ban de ${esc(b.playerName || b.playerId)}</h2>
      <div class="f"><label>Motivo</label><input type="text" id="bReason" value="${esc(b.reason)}"></div>
      <div class="grid g3" style="margin-top:10px">
        <div class="f"><label>Device IDs (um por linha)</label><textarea id="bDev" class="code" style="min-height:120px">${esc(b.deviceIds.join("\n"))}</textarea></div>
        <div class="f"><label>Hardware IDs</label><textarea id="bHw" class="code" style="min-height:120px">${esc(b.hardwareIds.join("\n"))}</textarea></div>
        <div class="f"><label>IPs</label><textarea id="bIp" class="code" style="min-height:120px">${esc(b.ips.join("\n"))}</textarea></div></div>
      <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn p" id="bGo">Salvar</button></div>`, { wide: true });

/* ═══════════════════════════════ RELATÓRIOS ═══════════════════════════════ */
const RET = [1, 3, 7, 14, 30];
const pct = (v, d = 1) => (v == null || !isFinite(v) ? "—" : `${(v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d })}%`);
const fmtDec = (v, d = 1) => (v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }));
const fmtDia = (d) => (d ? String(d).split("-").reverse().join("/") : "—");
const brlCurto = (c) => "R$ " + Math.round((c || 0) / 100).toLocaleString("pt-BR");

function varTag(d, { pp, invert } = {}) {
  if (d == null || !isFinite(d)) return "";
  const txt = `${d >= 0 ? "+" : ""}${fmtDec(d * 100)}${pp ? " p.p." : "%"}`;
  const flat = Math.abs(d) < (pp ? 0.005 : 0.02);
  const cls = flat ? "flat" : (invert ? d < 0 : d > 0) ? "up" : "down";
  return `<span class="delta ${cls}">${flat ? "■" : d > 0 ? "▲" : "▼"} ${txt}</span>`;
}
function deltaTag(cur, prev, opts = {}) {
  if (cur == null || prev == null) return "";
  if (opts.pp) return varTag(cur - prev, opts);
  if (!prev) return cur ? '<span class="delta up">▲ novo</span>' : "";
  return varTag((cur - prev) / prev, opts);
}
function kpi(l, cur, prev, fmt, { cls = "", pp, invert, sub, semBase } = {}) {
  const cmp = prev === undefined ? ""
    : semBase ? `<span class="hint">sem base de comparação ainda</span>`
    : `anterior ${fmt(prev)} ${deltaTag(cur, prev, { pp, invert })}`;
  return stat(l, fmt(cur), [sub, cmp].filter(Boolean).join(" · "), cls);
}

function lineChart(labels, series, { H = 200, fmt = fmtN } = {}) {
  const vals = series.flatMap((s) => s.values.filter((v) => v != null));
  if (!labels.length || !vals.length) return `<div class="empty">Sem dados no período.</div>`;
  const W = 680, pL = 52, pR = 10, pT = 10, pB = 22;
  const max = Math.max(1e-9, ...vals);
  const iw = W - pL - pR, ih = H - pT - pB;
  const x = (i) => pL + (labels.length === 1 ? iw / 2 : (i * iw) / (labels.length - 1));
  const y = (v) => pT + (1 - v / max) * ih;
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const v = max * f;
    return `<line class="g" x1="${pL}" x2="${W - pR}" y1="${y(v)}" y2="${y(v)}"/><text x="${pL - 6}" y="${y(v) + 3}" text-anchor="end">${esc(fmt(v))}</text>`;
  }).join("");
  const step = Math.max(1, Math.ceil(labels.length / 8));
  const xl = labels.map((l, i) => (i % step === 0 || i === labels.length - 1
    ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(fmtDia(l).slice(0, 5))}</text>` : "")).join("");
  const paths = series.map((s) => {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    const dots = labels.length <= 31 ? s.values.map((v, i) => (v == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" style="fill:${s.color}"/>`)).join("") : "";
    return `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" ${s.dashed ? 'stroke-dasharray="5 4"' : ""}/>${dots}`;
  }).join("");
  const cw = iw / labels.length;
  const hov = labels.map((l, i) => `<rect x="${x(i) - cw / 2}" y="${pT}" width="${cw}" height="${ih}" fill="transparent"><title>${esc(fmtDia(l))}\n${series.map((s) => `${s.name}: ${s.values[i] == null ? "—" : fmt(s.values[i])}`).join("\n")}</title></rect>`).join("");
  const legend = `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  return `${legend}<svg class="lchart" viewBox="0 0 ${W} ${H}">${grid}${xl}${paths}${hov}</svg>`;
}

function sparkline(vals, color = "var(--ok)") {
  if (vals.length < 2) return "";
  const W = 200, H = 34, max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => `${((i * W) / (vals.length - 1)).toFixed(1)},${(H - 2 - (v / max) * (H - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function heatmap(rows) {
  if (!rows.length) return `<div class="empty">A amostragem começou agora — o mapa se forma ao longo dos próximos dias.</div>`;
  const max = Math.max(1, ...rows.map((r) => r.m));
  const idx = new Map(rows.map((r) => [`${r.dow}:${r.h}`, r]));
  const dn = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  let h = `<div class="heat"><span></span>${Array.from({ length: 24 }, (_, i) => `<span class="lb">${i % 3 === 0 ? i : ""}</span>`).join("")}`;
  for (let d = 0; d < 7; d++) {
    h += `<span class="lb">${dn[d]}</span>`;
    for (let i = 0; i < 24; i++) {
      const c = idx.get(`${d}:${i}`);
      const bg = c ? `rgba(224,168,63,${(0.06 + (c.m / max) * 0.9).toFixed(2)})` : "var(--bg)";
      h += `<div style="background:${bg}" title="${dn[d]} ${i}h — média ${c ? fmtDec(c.m) : "—"} · pico ${c ? c.mx : "—"}"></div>`;
    }
  }
  return h + `</div><p class="hint" style="margin-top:8px">Média de jogadores em partida por hora local. Use para agendar eventos, wipes e pushes.</p>`;
}

function tabelaCoortes(rows) {
  if (!rows.length) return `<div class="empty">Nenhuma conta criada no período.</div>`;
  const cell = (c, n) => {
    const v = c[`d${n}`];
    if (v == null) return `<td class="c hint">·</td>`;
    const p = c.size ? v / c.size : 0;
    return `<td class="c" style="background:rgba(103,183,132,${(0.06 + p * 0.85).toFixed(2)})" title="${v} de ${c.size}">${pct(p, 0)}</td>`;
  };
  return `<div class="tw" style="max-height:430px"><table class="coh"><thead><tr><th>Coorte</th><th class="num">Contas</th>${RET.map((n) => `<th class="c">D${n}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((c) => `<tr><td>${fmtDia(c.day)}</td><td class="num">${fmtN(c.size)}</td>${RET.map((n) => cell(c, n)).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="hint" style="margin-top:8px">% das contas criadas no dia que abriram o jogo exatamente N dias depois. "·" = ainda não deu tempo.</p>`;
}

function baixarCSV(lines, nome) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }));
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

  </div>`;
}

VIEWS.reports = async function () {
  let days = Number(sessionStorage.getItem("decay.repDays")) || 30;
  let top = "kills";
  let G = null, T = null;

  setMain(`<div class="top"><div><h1>Relatórios</h1><p>Crescimento, retenção, engajamento, monetização e população, com a seção "Agora" ao vivo.</p></div>
    <div class="row"><span id="liveBadge" class="tag">conectando…</span>
      <select id="rdays" class="sm">${[7, 14, 30, 60, 90, 180, 365].map((d) => `<option value="${d}" ${d === days ? "selected" : ""}>${d} dias</option>`).join("")}</select>
      <button class="btn" data-act="csvdia">CSV diário</button><button class="btn" data-act="csvtempo">CSV de tempo</button><button class="btn" data-act="csv">CSV de vendas</button></div></div>
    <div id="live"><p class="hint">Conectando ao vivo…</p></div>
    <div id="rep"><p class="hint">Calculando relatórios…</p></div>
    <div id="repTempo"></div>`);

  const badge = (ok, txt) => {
    const b = $("#liveBadge");
    if (b) { b.className = `tag ${ok ? "ok" : "danger"}`; b.textContent = txt; }
  };

  async function load() {
    const [g, s, p, t] = await Promise.all([
      api(`/reports/growth?days=${days}`),
      api(`/reports/sales?days=${days}`),
      api(`/reports/players?days=${days}&top=${top}`),
      api(`/reports/playtime?days=${days}`, { silent: true }).catch(() => null),
    ]);
    G = g; T = t;
    const rep = $("#rep");
    if (!rep) return;
    rep.innerHTML = renderReports(g, s, p, top);
    const rt = $("#repTempo");
    if (rt) rt.innerHTML = t ? renderTempo(t) : `<div class="warnbox" style="margin-top:14px">Relatório de tempo de jogo indisponível.</div>`;
    const sel = $("#rtop");
    if (sel) sel.onchange = (e) => { top = e.target.value; load(); };
  }

  S.es?.close();
  S.es = new EventSource(`${S.base}/admin/api/reports/stream?key=${encodeURIComponent(S.key)}`);
  S.es.onmessage = (ev) => { badge(true, "ao vivo"); renderLive(JSON.parse(ev.data)); };
  S.es.onerror = () => badge(false, "reconectando…");

  $("#rdays").onchange = (e) => {
    days = +e.target.value;
    sessionStorage.setItem("decay.repDays", days);
    $("#rep").innerHTML = `<p class="hint">Calculando relatórios…</p>`;
    $("#repTempo").innerHTML = "";
    load();
  };

  ACTIONS.csvdia = () => {
    if (!G) return;
    const cols = ["day", "dau", "media7", "jogaram", "novos", "retornantes", "ressurgidos", "retornoPct", "comprasMp", "comprasPlay",
      "receitaMp", "receitaPlayEst", "receita", "pagantes", "novosPagantes", "ccuPico", "ccuMedio", "dcComprado", "dcGastoSkins", "dcAdmin"];
    const lines = [cols.join(";"), ...G.serie.map((r) => cols.map((c) => (r[c] == null ? "" : String(r[c]).replace(".", ","))).join(";"))];
    baixarCSV(lines, `diario-${days}d.csv`);
  };
  ACTIONS.csvtempo = () => {
    if (!T) return toast("Relatório de tempo indisponível.", "warn");
    const cols = ["day", "jogadores", "horas", "mediaMin", "sessaoMin", "pctJogaram"];
    const lines = [cols.join(";"), ...T.serie.map((r) => cols.map((c) => (r[c] == null ? "" : String(r[c]).replace(".", ","))).join(";"))];
    baixarCSV(lines, `tempo-${days}d.csv`);
  };
  ACTIONS.csv = async () => {
    const r = await api(`/orders?provider=mp&status=approved&hours=${days * 24}&limit=500`);

/* ═══════════════════════════════ ROLETA ═══════════════════════════════ */
const RAR = [["common", "Comum", "var(--muted)"], ["rare", "Raro", "var(--info)"], ["legendary", "Lendário", "var(--gold2)"]];
const rarTag = (k) => {
  const x = RAR.find((y) => y[0] === k);
  return `<span class="tag" style="color:${x ? x[2] : "inherit"}">${esc(x ? x[1] : k)}</span>`;
};

function novaRoleta(id) {
  return {
    rouletteId: id, title: "NOVA ROLETA", description: "", price: 100, currency: "DC",
    chances: { common: 70, rare: 25, legendary: 5 }, featuredSkinId: -1, freeSpinThreshold: 10,
    pity: { hardAt: 50, softStart: 35, softStepWeight: 4 }, preferUnowned: true,
    duplicateRefund: { currency: "DS", common: 20, rare: 60, legendary: 250 },
    slots: Array.from({ length: 10 }, (_, i) => ({ slotIndex: i, skinId: 0, rarity: i === 0 ? "legendary" : i < 4 ? "rare" : "common" })),
  };
}

/** Mesma normalização do master: só raridades com slot entram na conta. */
function chancesNormalizadas(r) {
  const present = RAR.map(([k]) => k).filter((k) => (r.slots || []).some((s) => s.rarity === k));
  const total = present.reduce((a, k) => a + (Number(r.chances?.[k]) || 0), 0);
  const out = {};
  for (const [k] of RAR) out[k] = present.includes(k) && total > 0 ? (Number(r.chances?.[k]) || 0) / total : 0;
  return out;
}

function girosTable(rows, { jogador = true } = {}) {
  return table([
    { h: "Quando", f: (g) => fmtDT(g.createdAt) },
    jogador
      ? { h: "Jogador", f: (g) => playerLink(g.playerId, g.playerName) }
      : { h: "Roleta", f: (g) => `<span class="mono">${esc(g.rouletteId)}</span>` },
    { h: "Prêmio", f: (g) => `slot ${g.slotIndex + 1} · <b class="mono">${g.skinId}</b>` },
    { h: "Raridade", f: (g) => rarTag(g.rarity) },
    { h: "Custo", f: (g) => g.wasFree ? '<span class="tag ok">grátis</span>' : `${fmtN(g.charged)} ${esc(g.currency)}`, num: true },
    { h: "", f: (g) => [
      g.pityTriggered ? '<span class="tag gold">pity</span>' : "",
      g.alreadyOwned ? `<span class="tag">duplicata +${fmtN(g.refundAmount)} ${esc(g.refundCurrency || "")}</span>` : "",
    ].join(" ") },
  ], rows, { empty: "Nenhum giro registrado." });
}

function renderSim(s) {
  const D = s.distribuicao, C = s.colecao, g = D.lendarioACada;
  let h = `<div class="grid g4" style="margin-top:14px">
    ${stat("Lendário a cada", g ? `${fmtDec(g.media, 1)} giros` : "—", g ? `mediana ${fmtN(g.mediana)} · p90 ${fmtN(g.p90)} · máx ${fmtN(g.max)}` : "nenhum lendário saiu", "gold")}
    ${stat("Custo médio por lendário", g ? `${fmtN(Math.round(g.media * s.price))} ${s.currency}` : "—", "sem descontar giros grátis")}
    ${stat("Lendário real", pct(D.observado.legendary, 2), `base ${pct(D.esperado.legendary, 2)} · com pity aplicado`, "info")}
    ${stat("Pity acionado", pct(D.pityPct, 2), `dos ${fmtN(D.spins)} giros simulados`)}
  </div>
  <div class="panel" style="margin-top:14px"><h2 style="margin-bottom:10px">Distribuição por raridade</h2>${table([
    { h: "Raridade", f: (k) => rarTag(k) },
    { h: "Base (exibida no jogo)", f: (k) => pct(D.esperado[k], 2), num: true },
    { h: "Real simulada", f: (k) => pct(D.observado[k], 2), num: true },
    { h: "Diferença", f: (k) => varTag(D.observado[k] - D.esperado[k], { pp: true }), num: true },
    { h: "Giros", f: (k) => fmtN(D.contagem[k]), num: true },
  ], RAR.map(([k]) => k))}</div>`;

  if (C) h += `<div class="panel" style="margin-top:14px"><h2 style="margin-bottom:6px">Completar a roleta (${s.unicas} skins diferentes)</h2>
    <p class="hint" style="margin:0 0 12px">${fmtN(C.jogadores)} jogadores começando do zero, girando até ter todas (limite de ${fmtN(C.maxPorJogador)} giros cada).</p>
    <div class="grid g4">
      ${stat("Completaram", pct(C.completaramPct, 1), `dentro de ${fmtN(C.maxPorJogador)} giros`, C.completaramPct >= 0.99 ? "ok" : "danger")}
      ${stat("Giros até completar", C.giros ? fmtN(Math.round(C.giros.mediana)) : "—", C.giros ? `média ${fmtDec(C.giros.media, 0)} · p90 ${fmtN(C.giros.p90)}` : "")}
      ${stat("Custo até completar", C.custo ? `${fmtN(Math.round(C.custo.mediana))} ${s.currency}` : "—", C.custo ? `média ${fmtN(Math.round(C.custo.media))} · p90 ${fmtN(C.custo.p90)} · ${fmtDec(C.gratis.media, 1)} grátis em média` : "", "gold")}
      ${stat("Reembolso de duplicatas", C.reembolso ? `${fmtN(Math.round(C.reembolso.media))} ${s.refundCurrency}` : "—", "média por jogador")}
    </div></div>`;
  return h;
}

VIEWS.roulette = async function (tab = "config") {
  const d = await api("/roulette");
  const st = { raw: JSON.parse(JSON.stringify(d.raw || {})), sel: 0, dirty: false, tab, statId: null, statDays: 30 };
  if (!Array.isArray(st.raw.roulettes)) st.raw.roulettes = [];
  if (st.raw.activeRouletteId === undefined) st.raw.activeRouletteId = null;
  const iAtiva = st.raw.roulettes.findIndex((x) => x.rouletteId === st.raw.activeRouletteId);
  if (iAtiva >= 0) st.sel = iAtiva;

  const existe = new Set(d.skins.map((s) => s.skinId));
  const skinNome = new Map(d.skins.map((s) => [s.skinId, s.name]));
  const resumo = new Map((d.resumo || []).map((x) => [x.rouletteId, x]));
  const cur = () => st.raw.roulettes[st.sel];
  const nomeSkin = (id) => (skinNome.get(id) ? `${id} · ${esc(skinNome.get(id))}` : `${id}`);

  setMain(`<div class="top"><div><h1>Roleta</h1>
      <p>Ativa no servidor: <b class="mono">${esc(d.ativaCarregada || "nenhuma")}</b> · preço, chances e pity são decididos aqui; o cliente só envia o rouletteId.
      <span id="rDirty" class="tag gold" style="display:none">alterações não salvas</span></p></div>
    <div class="row"><button class="btn" data-act="rreload">Recarregar do disco</button><button class="btn p" data-act="rsave">Salvar e aplicar</button></div></div>
    ${d.erros?.length ? `<div class="dangerbox" style="margin-bottom:12px"><b>roulette.json no disco tem problemas</b> (o que é inválido não foi carregado):<br>${d.erros.map(esc).join("<br>")}</div>` : ""}
    ${d.avisos?.length ? `<div class="warnbox" style="margin-bottom:12px">${d.avisos.map(esc).join("<br>")}</div>` : ""}
    <div class="tabs" id="rtabs"></div><div id="rbody"></div>`);

  const TABS = [["config", "Configuração"], ["stats", "Estatísticas"], ["sim", "Simulador"], ["json", "JSON"]];

  function paint() {
    $("#rtabs").innerHTML = TABS.map(([k, l]) => `<button class="${k === st.tab ? "on" : ""}" data-act="rtab" data-t="${k}">${l}</button>`).join("");
    bindActions($("#rtabs"));
    if (st.tab === "stats") return paintStats();
    if (st.tab === "sim") return paintSim();
    if (st.tab === "json") return paintJson();
    paintConfig();
  }

  const marcarSujo = () => { st.dirty = true; const b = $("#rDirty"); if (b) b.style.display = ""; };

  // ── Configuração ──────────────────────────────────────────────────────────
  const selOpts = () => st.raw.roulettes.map((x, i) =>
    `<option value="${i}" ${i === st.sel ? "selected" : ""}>${esc(x.rouletteId || "(sem id)")}${x.rouletteId === st.raw.activeRouletteId ? " ★ ativa" : ""}</option>`).join("");

  const featOpts = (r) => {
    const ids = [...new Set(r.slots.map((s) => s.skinId).filter((x) => x > 0))];
    return `<option value="-1" ${!(r.featuredSkinId > 0) ? "selected" : ""}>Automático (maior raridade)</option>` +
      ids.map((id) => `<option value="${id}" ${id === r.featuredSkinId ? "selected" : ""}>${nomeSkin(id)}</option>`).join("") +
      (r.featuredSkinId > 0 && !ids.includes(r.featuredSkinId) ? `<option value="${r.featuredSkinId}" selected>${r.featuredSkinId} · não está nos slots</option>` : "");
  };

  const skinOpts = (v) =>
    (existe.has(v) ? "" : `<option value="${v || 0}" selected>${v ? `${v} · NÃO existe em skins.json` : "— escolha uma skin —"}</option>`) +
    d.skins.map((s) => `<option value="${s.skinId}" ${s.skinId === v ? "selected" : ""}>${s.skinId}${s.name ? ` · ${esc(s.name)}` : ""}${s.slotKey ? "" : " (sem slot)"}${s.available ? "" : " · fora da loja"}</option>`).join("");

  function pityTexto(r) {
    const p = r.pity || {}, moeda = r.currency || "DC";
    if (!(p.hardAt > 0)) return "Sem garantia: o lendário depende só da sorte.";
    let t = `Lendário garantido no <b>${p.hardAt}º</b> giro seguido sem lendário — custo máximo ~<b>${fmtN(p.hardAt * (r.price || 0))} ${esc(moeda)}</b> (sem contar giros grátis).`;
    if (p.softStart > 0 && p.softStepWeight > 0) t += ` A partir do ${p.softStart + 1}º giro, o peso do lendário sobe +${p.softStepWeight} por giro.`;
    if (p.softStart > 0 && p.softStart >= p.hardAt) t += ` <span class="tag danger">o pity suave precisa começar antes do garantido</span>`;
    return t;
  }

  function avisosLocais(r) {
    const a = [];
    const ids = st.raw.roulettes.map((x) => x.rouletteId);
    if (!r.rouletteId) a.push("rouletteId vazio.");
    else if (ids.filter((x) => x === r.rouletteId).length > 1) a.push(`rouletteId "${r.rouletteId}" repetido.`);
    if (r.slots.length !== 10) a.push(`${r.slots.length} slots — o cliente tem 10.`);
    const vazios = r.slots.filter((s) => !(s.skinId > 0)).length;
    if (vazios) a.push(`${vazios} slot(s) sem skin.`);
    const inexist = r.slots.filter((s) => s.skinId > 0 && !existe.has(s.skinId)).length;
    if (inexist) a.push(`${inexist} skin(s) não existem em skins.json — o master recusa a roleta.`);
    const preenchidos = r.slots.filter((s) => s.skinId > 0);
    const dup = preenchidos.length - new Set(preenchidos.map((s) => s.skinId)).size;
    if (dup > 0) a.push(`${dup} skin(s) aparecem em mais de um slot (permitido, mas aumenta a chance delas).`);

    for (const [k] of RAR) { const el = $(`#rch_${k}`); if (el) el.textContent = pct(n[k], 2); }

    const moeda = (k, label) =>
      `<div class="f"><label>${label}</label><select data-rk="${k}" data-rt="text">${["DC", "DS"].map((c) => `<option ${getP(r, k) === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>`;

    body.innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <select id="rSel" class="sm" style="min-width:220px">${selOpts()}</select>
      ${ativa ? '<span class="tag gold">ativa</span>' : '<span class="tag">inativa</span>'}
      <span class="hint">${hist ? `${fmtN(hist.giros)} giros · ${fmtN(hist.jogadores)} jogadores · último há ${ago(hist.ultimo)}` : "sem giros registrados"}</span>
      <span style="flex:1"></span>
      <button class="btn sm" data-act="rnew">Nova</button>
      <button class="btn sm" data-act="rdup">Duplicar</button>
      ${ativa ? `<button class="btn sm" data-act="ractive" data-on="0">Desativar</button>` : `<button class="btn sm p" data-act="ractive" data-on="1">Tornar ativa</button>`}
      <button class="btn sm d" data-act="rdel">Excluir</button>
    </div>
    <div id="rSum" style="margin-bottom:14px"></div>
    <div class="grid g2">

        <div class="f"><label>rouletteId</label><input type="text" data-rk="rouletteId" data-rt="text" value="${esc(r.rouletteId || "")}">
          <span class="sub">Giro grátis e pity são guardados por id. Trocar o id = roleta nova pros jogadores.</span></div>

    <div class="panel" style="margin-top:14px"><div class="ph"><h2>Slots</h2>
      ${r.slots.length !== 10 ? `<button class="btn sm" data-act="rfix10">Ajustar para 10 slots</button>` : `<span class="hint">Slot 1 = filho "1" da roleta na Unity</span>`}</div>
      <div class="tw"><table><thead><tr><th>Slot</th><th>Skin</th><th>Raridade</th><th class="num">Chance individual</th></tr></thead><tbody>
      ${r.slots.map((s, i) => `<tr>
        <td><b>${s.slotIndex + 1}</b> <span class="hint mono">idx ${s.slotIndex}</span></td>
        <td><select class="sm" style="min-width:280px" data-rk="slots.${i}.skinId" data-rt="int">${skinOpts(s.skinId)}</select></td>
        <td><select class="sm" data-rk="slots.${i}.rarity" data-rt="text">${RAR.map(([k, l]) => `<option value="${k}" ${s.rarity === k ? "selected" : ""}>${l}</option>`).join("")}</select></td>
        <td class="num" id="rsc${i}">—</td></tr>`).join("")}
      </tbody></table></div></div>`;

    $$("[data-rk]", body).forEach((el) => {
      el.onchange = () => {
        const t = el.dataset.rt, k = el.dataset.rk;
        let v = t === "bool" ? el.checked : t === "int" ? parseInt(el.value, 10) : t === "float" ? parseFloat(el.value) : el.value.trim();
        if ((t === "int" || t === "float") && !Number.isFinite(v)) v = 0;
        if (k === "rouletteId" && st.raw.activeRouletteId === cur().rouletteId) st.raw.activeRouletteId = v;
        setP(cur(), k, v);
        marcarSujo();
        derivados();
      };
    });
    $("#rSel", body).onchange = (e) => { st.sel = +e.target.value; paintConfig(); };
    bindActions(body);
    derivados();
  }

  // ── Estatísticas ──────────────────────────────────────────────────────────
  function renderStats(s) {
    const T = s.totais, C = s.config, P = s.progresso || {};
    const moeda = T.moeda || C?.currency || "DC";
    if (!T.giros) return `<div class="empty">Nenhum giro de <b>${esc(s.rouletteId)}</b> no período.</div>`;

    const porRar = new Map(s.porRaridade.map((x) => [x.rarity, x.n]));
    const cntRar = {};
    (C?.slots || []).forEach((x) => { cntRar[x.rarity] = (cntRar[x.rarity] || 0) + 1; });
    const porSlot = (C?.slots || []).map((x) => ({
      ...x,
      n: s.porSlot.filter((y) => y.slotIndex === x.slotIndex && y.skinId === x.skinId).reduce((a, y) => a + y.n, 0),
      esp: C.esperado[x.rarity] / (cntRar[x.rarity] || 1),
    }));
    const reemb = s.reembolsos.map((x) => `${fmtN(x.total)} ${esc(x.currency)}`).join(" + ") || "nenhum";
    const dias = s.porDia.map((x) => x.day);

    return `
    ${!C ? `<div class="warnbox" style="margin-bottom:12px">Essa roleta não está carregada no servidor: a comparação com as chances configuradas fica indisponível.</div>` : ""}
    <div class="grid g4">
      ${stat("Giros", fmtN(T.giros), `${fmtN(T.giros - T.gratis)} pagos · ${fmtN(T.gratis)} grátis`, "info")}
      ${stat("Moeda gasta", `${fmtN(T.gasto)} ${esc(moeda)}`, `${fmtN(T.jogadores)} jogadores · ${fmtN(Math.round(T.gasto / Math.max(1, T.jogadores)))} ${esc(moeda)}/jogador`, "gold")}
      ${stat("Lendários", fmtN(T.lendarios), `${pct(T.lendarios / T.giros, 2)} dos giros · ${fmtN(T.pity)} por pity`, "ok")}
      ${stat("Duplicatas", fmtN(T.duplicatas), `${pct(T.duplicatas / T.giros, 1)} · reembolso ${reemb}`)}
      ${stat("Jogadores com progresso", fmtN(P.jogadores || 0), `média de ${fmtDec(P.mediaSemLendario || 0, 1)} giros sem lendário`)}
      ${stat("Giros grátis pendentes", fmtN(P.gratisPendentes || 0), "concedidos e ainda não usados")}
      ${stat("Perto do pity", fmtN(P.pertoDoPity || 0), C?.pity?.hardAt ? `a até 5 giros do garantido (${C.pity.hardAt})` : "pity desligado")}
      ${stat("Preço atual", C ? `${fmtN(C.price)} ${esc(C.currency)}` : "—", C?.pity?.hardAt ? `garantia em ${C.pity.hardAt} giros` : "")}
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="panel"><h2 style="margin-bottom:10px">Giros por dia</h2>${lineChart(dias, [
        { name: "Giros", values: s.porDia.map((x) => x.giros), color: "var(--info)", w: 2.5 },
        { name: "Jogadores", values: s.porDia.map((x) => x.jogadores), color: "var(--ok)" },
      ])}</div>
      <div class="panel"><h2 style="margin-bottom:10px">${esc(moeda)} gasto por dia</h2>${lineChart(dias, [
        { name: moeda, values: s.porDia.map((x) => x.gasto), color: "var(--gold)", w: 2.5 },
      ])}</div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="panel"><h2 style="margin-bottom:10px">Raridade: real × configurada</h2>${table([
        { h: "Raridade", f: (k) => rarTag(k) },
        { h: "Giros", f: (k) => fmtN(porRar.get(k) || 0), num: true },
        { h: "Real", f: (k) => pct((porRar.get(k) || 0) / T.giros, 2), num: true },
        { h: "Configurada", f: (k) => (C ? pct(C.esperado[k], 2) : "—"), num: true },
        { h: "Diferença", f: (k) => (C ? varTag((porRar.get(k) || 0) / T.giros - C.esperado[k], { pp: true }) : ""), num: true },
      ], RAR.map(([k]) => k))}
        <p class="hint" style="margin-top:8px">Com pity, o lendário real fica acima do configurado, e isso é esperado. Com poucos giros, diferenças grandes são só variância.</p></div>
      <div class="panel"><h2 style="margin-bottom:10px">Por slot</h2>${table([
        { h: "Slot", f: (x) => x.slotIndex + 1 },
        { h: "Skin", f: (x) => nomeSkin(x.skinId) },
        { h: "Raridade", f: (x) => rarTag(x.rarity) },
        { h: "Saiu", f: (x) => fmtN(x.n), num: true },
        { h: "Real", f: (x) => pct(x.n / T.giros, 2), num: true },
        { h: "Configurada", f: (x) => pct(x.esp, 2), num: true },
      ], porSlot, { empty: "Configuração indisponível." })}</div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="panel"><h2 style="margin-bottom:10px">Quem mais girou</h2>${table([
        { h: "Jogador", f: (x) => playerLink(x.playerId, x.playerName) },
        { h: "Giros", f: (x) => fmtN(x.giros), num: true },
        { h: "Gasto", f: (x) => `${fmtN(x.gasto)} ${esc(moeda)}`, num: true },
        { h: "Lendários", f: (x) => fmtN(x.lendarios), num: true },
      ], s.top)}</div>
      <div class="panel"><h2 style="margin-bottom:10px">Últimos giros</h2>${girosTable(s.recentes)}</div>
    </div>`;
  }

  async function paintStats() {
    const body = $("#rbody");
    const ids = [...new Set([...st.raw.roulettes.map((x) => x.rouletteId), ...(d.resumo || []).map((x) => x.rouletteId)].filter(Boolean))];
    if (!ids.length) { body.innerHTML = `<div class="empty">Nenhuma roleta ainda.</div>`; return; }
    if (!st.statId || !ids.includes(st.statId)) st.statId = ids.includes(d.ativaCarregada) ? d.ativaCarregada : ids[0];

    body.innerHTML = `<div class="row" style="margin-bottom:12px">
      <select id="rsId" class="sm">${ids.map((id) => `<option ${id === st.statId ? "selected" : ""}>${esc(id)}</option>`).join("")}</select>
      <select id="rsDays" class="sm">${[1, 7, 14, 30, 90, 365].map((n) => `<option value="${n}" ${n === st.statDays ? "selected" : ""}>${n === 1 ? "Hoje" : `${n} dias`}</option>`).join("")}</select>
      <button class="btn sm" data-act="rstats">Atualizar</button></div>
      <div id="rsOut"><p class="hint">Carregando…</p></div>`;
    $("#rsId").onchange = (e) => { st.statId = e.target.value; paintStats(); };
    $("#rsDays").onchange = (e) => { st.statDays = +e.target.value; paintStats(); };
    bindActions(body);

    const s = await api(`/roulette/stats?rouletteId=${encodeURIComponent(st.statId)}&days=${st.statDays}`);
    const out = $("#rsOut");
    if (out) out.innerHTML = renderStats(s);
  }

  // ── Simulador ─────────────────────────────────────────────────────────────
  function paintSim() {
    const body = $("#rbody");
    const r = cur();
    if (!r) { body.innerHTML = `<div class="empty">Crie uma roleta primeiro.</div>`; return; }
    body.innerHTML = `<div class="panel"><h2>Simular "${esc(r.rouletteId)}"</h2>
      <p class="hint" style="margin:4px 0 12px">Roda o mesmo algoritmo do master com o rascunho atual, incluindo o que ainda não foi salvo. Nada é gravado.</p>
      <div class="row" style="align-items:flex-end">
        <div class="f"><label>Giros (distribuição)</label><input type="number" id="smSpins" value="100000" min="1000" max="300000" style="width:150px"></div>
        <div class="f"><label>Jogadores (coleção completa)</label><input type="number" id="smPlayers" value="300" min="0" max="1000" style="width:150px"></div>
        <div class="f"><label>Limite de giros por jogador</label><input type="number" id="smMax" value="2000" min="10" max="5000" style="width:150px"></div>
        <button class="btn p" data-act="rsim">Simular</button>
      </div></div><div id="smOut"></div>`;
    bindActions(body);
  }

  // ── JSON ──────────────────────────────────────────────────────────────────
  function paintJson() {
    $("#rbody").innerHTML = `<div class="panel"><p class="hint" style="margin:0 0 10px">Conteúdo completo de data/roulette.json. "Salvar e aplicar" valida tudo no master antes de gravar.</p>
      <textarea id="rJson" class="code" style="min-height:65vh">${esc(JSON.stringify(st.raw, null, 2))}</textarea></div>`;
  }

  function lerJson() {
    const ta = $("#rJson");
    if (!ta) return true;
    try {
      const v = JSON.parse(ta.value);
      if (!v || !Array.isArray(v.roulettes)) throw new Error("o objeto precisa ter roulettes: []");
      if (JSON.stringify(v) !== JSON.stringify(st.raw)) { st.raw = v; st.sel = 0; marcarSujo(); }
      return true;
    } catch (e) {
      toast(`JSON inválido: ${e.message}`, "err");
      return false;
    }
  }

  // ── Ações ─────────────────────────────────────────────────────────────────
  ACTIONS.rtab = (x) => {
    if (st.tab === "json" && !lerJson()) return;
    st.tab = x.t;
    history.replaceState(null, "", `#/roulette/${x.t}`);
    paint();
  };
  ACTIONS.rstats = () => paintStats();

  ACTIONS.rnew = async () => {
    const id = await confirmar("Nova roleta", "Identificador fixo (letras, números, _ e -).", { okLabel: "Criar", campo: { label: "rouletteId", placeholder: "temporada_02" } });
    if (id == null) return;
    const v = id.trim();
    if (!/^[\w-]{2,40}$/.test(v)) return toast("rouletteId inválido.", "warn");
    if (st.raw.roulettes.some((x) => x.rouletteId === v)) return toast("Esse rouletteId já existe.", "warn");
    st.raw.roulettes.push(novaRoleta(v));
    st.sel = st.raw.roulettes.length - 1;
    marcarSujo(); paintConfig();
  };

  ACTIONS.rdup = () => {
    const c = JSON.parse(JSON.stringify(cur()));
    let n = 2;
    while (st.raw.roulettes.some((x) => x.rouletteId === `${c.rouletteId}_${n}`)) n++;
    c.rouletteId = `${c.rouletteId}_${n}`;
    st.raw.roulettes.push(c);
    st.sel = st.raw.roulettes.length - 1;
    marcarSujo(); paintConfig();
  };

  ACTIONS.rdel = async () => {
    const r = cur();
    if (!(await confirmar("Excluir roleta", `Remove <b>${esc(r.rouletteId)}</b> do arquivo. O histórico de giros e o progresso dos jogadores continuam no banco.`, { danger: true, okLabel: "Excluir" }))) return;
    if (st.raw.activeRouletteId === r.rouletteId) st.raw.activeRouletteId = null;
    st.raw.roulettes.splice(st.sel, 1);
    st.sel = Math.max(0, st.sel - 1);
    marcarSujo(); paintConfig();
  };

  ACTIONS.ractive = (x) => {
    st.raw.activeRouletteId = x.on === "1" ? cur().rouletteId : null;
    marcarSujo(); paintConfig();
  };

  ACTIONS.rfix10 = () => {
    const r = cur();
    r.slots = Array.from({ length: 10 }, (_, i) => (r.slots[i] ? { ...r.slots[i], slotIndex: i } : { slotIndex: i, skinId: 0, rarity: "common" }));
    marcarSujo(); paintConfig();
  };

  ACTIONS.rsim = async () => {
    const out = $("#smOut");
    out.innerHTML = `<p class="hint" style="margin-top:14px">Simulando…</p>`;
    let x = null;
    try {
      x = await api("/roulette/simulate", {
        method: "POST",
        silent: true,
        body: { roulette: cur(), spins: +$("#smSpins").value, players: +$("#smPlayers").value, maxSpinsPerPlayer: +$("#smMax").value },
      });
    } catch (e) {
      if ($("#smOut")) $("#smOut").innerHTML = `<div class="dangerbox" style="margin-top:14px">${esc(e.message)}</div>`;
      return;
    }
    if ($("#smOut")) $("#smOut").innerHTML = renderSim(x.sim);
  };

  ACTIONS.rsave = async () => {
    if (st.tab === "json" && !lerJson()) return;
    if (st.raw.activeRouletteId == null &&
        !(await confirmar("Sem roleta ativa", "Nenhuma roleta está marcada como ativa: a aba de roleta no jogo vai mostrar erro de carregamento.", { okLabel: "Salvar mesmo assim" }))) return;
    const x = await api("/roulette", { method: "PUT", body: { config: st.raw } });
    toast(`Roleta salva · ${x.count} carregada(s) · ativa: ${x.activeId || "nenhuma"}`);
    if (x.avisos?.length) toast(x.avisos.join(" · "), "warn", 8000);
    st.dirty = false;
    route();
  };

  ACTIONS.rreload = async () => {
    if (st.dirty && !(await confirmar("Descartar rascunho", "As alterações não salvas serão perdidas.", { danger: true, okLabel: "Descartar" }))) return;
    const x = await api("/roulette/reload", { method: "POST", body: {} });
    toast(`${x.count} roleta(s) carregada(s) do disco.`);
    route();
  };

  paint();
};

/* ═══════════════════════════════ POP-UPS ═══════════════════════════════ */

const POPUP_FREQ = [
  ["always", "Sempre que abrir o menu"],
  ["once", "Uma vez por arte"],
  ["daily", "Uma vez por dia"],
];
const POPUP_PLATS = ["android", "ios", "windows", "osx"];
const POPUP_LANGS = [["pt", "Português"], ["en", "Inglês"], ["es", "Espanhol"]];

/** "skins-outubro-pt" → "skins-outubro". Agrupa as versões de uma mesma campanha. */
const baseDoPopup = (id) => String(id || "").replace(/-(pt|en|es)$/, "");

const dtLocal = (s) => {
  if (!s) return "";
  const d = new Date(s * 1000), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};
const dtEpoch = (v) => (v ? Math.floor(new Date(v).getTime() / 1000) : null);

/* upload vai como binário cru: o express.json global ignora image/*  */
async function uploadImagemPopup(popupId, file) {
  const res = await fetch(`${S.base}/admin/api/popups/${encodeURIComponent(popupId)}/image`, {
    method: "POST",
    headers: { "Content-Type": file.type, "X-Admin-Key": S.key },
    body: file,
  });
  let j = null;
  try { j = await res.json(); } catch { /* vazio */ }
  if (!res.ok || j?.ok === false) throw new Error(j?.error || `${res.status} ${res.statusText}`);
  return j;
}

VIEWS.popups = async function () {
  let lista = [];

  async function load() {
    const r = await api("/popups");
    lista = r.popups;
    $("#ppInfo").textContent = `${lista.length} pop-up(s) · ${lista.filter((p) => p.enabled !== false).length} ativo(s) · revisão ${r.revision}`;

      { h: "Botão", f: (p) => p.linkUrl ? `<a href="${esc(p.linkUrl)}" target="_blank" rel="noopener">${esc(p.buttonText || "abrir link")}</a>` : '<span class="hint">só fechar</span>' },

      { h: "Idioma", f: (p) => p.languages?.length

          : '<span class="hint">todos</span>' },
      { h: "Plataforma", f: (p) => (p.platforms?.length ? p.platforms : ["todas"]).map((x) => `<span class="tag">${esc(x)}</span>`).join(" ") },
      { h: "Status", f: (p) => p.enabled === false ? '<span class="tag">desligado</span>' : '<span class="tag ok">no ar</span>' },

  function sugestaoTraducao(p) {
    const base = baseDoPopup(p.popupId);
    const usados = new Set(lista.filter((x) => baseDoPopup(x.popupId) === base).flatMap((x) => x.languages || []));
    const livre = POPUP_LANGS.map(([k]) => k).find((k) => !usados.has(k));
    return livre ? { id: `${base}-${livre}`, langs: [livre] } : { id: `${base}-copia`, langs: [] };
  }

  const form = (p = {}, { traduzir = false } = {}) => {
